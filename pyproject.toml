[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pydantic>=2.5",
    "pytest>=8.0",
    "pyright>=1.1.380",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["plugins/ralph/skills/ralph-run/scripts"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pyright]
include = ["plugins/ralph/skills/ralph-run/scripts"]
strict = ["plugins/ralph/skills/ralph-run/scripts"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["plugins/ralph/skills/ralph-run/tests"]
pythonpath = ["plugins/ralph/skills/ralph-run/scripts"]

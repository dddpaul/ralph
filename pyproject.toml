[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pydantic>=2.5",
    "pytest>=8.0",
    "pyright>=1.1.380",
    "ruff>=0.7.0",
]

[tool.ruff]
# Formatter wrap target only. `ruff format` is deliberately not a gate: gating
# it would reformat existing files for no functional reason, and raising this
# to 120 would make the formatter rejoin deliberately wrapped lines.
line-length = 88
target-version = "py314"
src = ["plugins/ralph/skills/ralph-run/scripts"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "E501"]

[tool.ruff.lint.pycodestyle]
# The enforced code line limit: wrap at 88 by habit, fail the gate past 120.
max-line-length = 120

[tool.pyright]
include = ["plugins/ralph/skills/ralph-run/scripts"]
strict = ["plugins/ralph/skills/ralph-run/scripts"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["plugins/ralph/skills/ralph-run/tests", "tests/python"]
pythonpath = ["plugins/ralph/skills/ralph-run/scripts"]
